server:
  port: 8080

spring:
  application:
    name: sis1
  profiles:
    active: "@spring.profiles.active@"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names: bookings
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

app:
  name: SIS 1
  environment: default
  max-items: 10
  support-email: support@example.com
  mood-audit:
    enabled: false
  logging:
    slow-threshold-ms: 200
  holiday-client:
    base-url: https://date.nager.at/api/v3
    country-code: KZ
    connect-timeout: 2s
    read-timeout: 3s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
